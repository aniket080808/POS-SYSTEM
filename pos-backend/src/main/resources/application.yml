spring:
  application:
    name: pos-system

  jackson:
    time-zone: Asia/Kolkata
    locale: en_IN

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pos}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  devtools:
    livereload:
      enabled: true

server:
  port: ${SERVER_PORT:5000}

razorpay:
  api:
    key: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}

gemini:
  api:
    key: ${GEMINI_API_KEY}

app:
  frontend:
    reset-url: ${FRONTEND_RESET_URL}
  admin:
    email: ${ADMIN_EMAIL_ANIKET:aniketmeshram445@gmail.com}
    password: ${ADMIN_PASSWORD_ANIKET:Admin123@}
    full-name: ${ADMIN_FULL_NAME_ANIKET:Aniket Meshram}

logging:
  level:
    org:
      hibernate:
        SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:DEBUG}
        type:
          descriptor:
            sql: TRACE