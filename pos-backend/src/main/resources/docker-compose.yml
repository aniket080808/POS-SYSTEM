version: "3.8"

services:
  posdb:
    image: postgres:16
    container_name: posdb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-pos}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-pos}"]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 10s
    networks:
      - aniket

  pos-system:
    image: ${DOCKER_IMAGE:-your-dockerhub-username/pos-system:latest}
    depends_on:
      posdb:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      DB_HOST: posdb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pos}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL}
    networks:
      - aniket

networks:
  aniket: